<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 20px;
    }

    #image {
      width: 500px;
      height: 350px;
      line-height: 350px;
      margin: 0 auto 20px auto;
      background-color: #8e68ff;
      background-size: cover;
      background-position: center;
      color: #ffffff;
      font-size: 20px;
      border: 2px solid #333333;
    }

    .preview {
      width: 150px;
      height: 100px;
      object-fit: cover;
      margin: 0 10px;
      cursor: pointer;
      border: 2px solid #333333;
    }
  </style>
</head>
<body>

  <div id="image">
    Hover over an image below to display here
  </div>

  <div class="gallery">
    <img class="preview"
         alt="Mountain view at sunrise"
         src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
         onmouseover="upDate(this)"
         onfocus="upDate(this)"
         onmouseout="unDo()"
         onblur="unDo()">

    <img class="preview"
         alt="Calm forest path in autumn"
         src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800"
         onmouseover="upDate(this)"
         onfocus="upDate(this)"
         onmouseout="unDo()"
         onblur="unDo()">

    <img class="preview"
         alt="Ocean waves along the coast"
         src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
         onmouseover="upDate(this)"
         onfocus="upDate(this)"
         onmouseout="unDo()"
         onblur="unDo()">
  </div>

  <script src="gallery.js"></script>
</body>
</html>
